<!DOCTYPE html>
<html lang="en">
<!--
  Ursula — signature launch intro.
  Loaded by a frameless pre-workbench splash BrowserWindow (electron-main).
  Canvas hyperspace starfield (stars emit from center, streak outward, accelerate)
  + animated "Hello {Name}, build something great."
  Bone + Gold, zero dependencies, 60fps, DPR-aware, respects prefers-reduced-motion.
  Name is passed in via ?name= by the host; falls back to "Drey".
  The host window is closed by the main process after the workbench is ready;
  this file just plays a ~2.5-2.8s timeline and ends on a fade.
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ursula</title>
<style>
  :root{
    --bone:#F4F1EC; --gold:#C2A878; --gold2:#D8BE8E;
    --bg:#0B0B0D; --muted:#9A958C;
  }
  @font-face{font-family:"Big Shoulders Display";font-weight:600;font-style:normal;font-display:block;src:url("./fonts/big-shoulders-display-600.woff2") format("woff2")}
  @font-face{font-family:"Big Shoulders Display";font-weight:700;font-style:normal;font-display:block;src:url("./fonts/big-shoulders-display-700.woff2") format("woff2")}
  @font-face{font-family:"Big Shoulders Display";font-weight:800;font-style:normal;font-display:block;src:url("./fonts/big-shoulders-display-800.woff2") format("woff2")}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
  body{
    font-family:"Big Shoulders Display","Arial Narrow",-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stars{position:fixed;inset:0;display:block}
  #greet{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:7px;text-align:center;
    opacity:0;transition:opacity .5s ease;pointer-events:none;
    text-shadow:0 1px 30px rgba(0,0,0,.6);
  }
  #greet .hi{
    font-size:clamp(36px,7vw,78px);font-weight:800;letter-spacing:1px;
    color:var(--bone);line-height:1;
  }
  #greet .hi .name{color:var(--gold)}
  #greet .sub{
    font-size:clamp(10px,1.5vw,16px);letter-spacing:5px;text-transform:uppercase;
    color:var(--muted);font-weight:600;
  }
  #greet .mark{
    margin-top:20px;font-size:12px;letter-spacing:9px;color:var(--gold2);
    text-transform:uppercase;opacity:0;
  }
  #fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .45s ease}
</style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div id="greet">
    <div class="hi">Hello <span class="name" id="name">Drey</span></div>
    <div class="sub">build something great</div>
    <div class="mark" id="mark">URSULA</div>
  </div>
  <div id="fade"></div>
<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Name (sanitized) via ?name= from the host; default "Drey".
  var raw = "";
  try { raw = new URLSearchParams(location.search).get('name') || ""; } catch(e){}
  var name = (raw || "Drey").replace(/[<>&"'\r\n]/g,'').slice(0,24).trim() || "Drey";
  document.getElementById('name').textContent = name;

  var greet = document.getElementById('greet');
  var mark  = document.getElementById('mark');
  var fade  = document.getElementById('fade');

  // Show greeting, hold, then fade out so the workbench takes over.
  // Host closes this window; the fade just bridges the handoff visually.
  function timeline(showAtMs, holdMs){
    setTimeout(function(){ greet.style.opacity = '1'; }, showAtMs);
    setTimeout(function(){ mark.style.transition='opacity .6s ease'; mark.style.opacity = '.85'; }, showAtMs + 350);
    setTimeout(function(){ fade.style.opacity = '1'; }, showAtMs + holdMs);
  }

  if(reduce){
    // Calm path: no warp, just the greeting, short hold.
    timeline(80, 1300);
    return;
  }

  // ---- hyperspace warp ----
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var W=0,H=0,CX=0,CY=0,DPR=1;
  var MAX = 460;
  var COLS = ['#F4F1EC','#F4F1EC','#F4F1EC','#C2A878','#D8BE8E']; // mostly bone, gold flecks
  var RAMP_MS = 1300;   // ease-in to top speed
  var MAX_SPEED = 0.055;
  var stars = null;
  var startT = 0;

  function rnd(a,b){ return a + Math.random()*(b-a); }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width  = Math.floor(innerWidth  * DPR);
    H = canvas.height = Math.floor(innerHeight * DPR);
    canvas.style.width  = innerWidth  + 'px';
    canvas.style.height = innerHeight + 'px';
    CX = W/2; CY = H/2;
    if(!stars){
      stars = new Array(MAX);
      for(var i=0;i<MAX;i++){
        stars[i] = { x:rnd(-1,1), y:rnd(-1,1), z:rnd(.05,1), pz:1, col:COLS[(Math.random()*COLS.length)|0] };
      }
    }
  }

  function frame(t){
    if(!startT) startT = t;
    var el = t - startT;
    var k = el < RAMP_MS ? (el/RAMP_MS) : 1;
    var speed = MAX_SPEED * k * k;            // quadratic ramp = accelerating warp
    var fadeIn = Math.min(1, el/300);          // stars emerge from black

    // motion-blur trail: translucent fill instead of clear, then additive streaks
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(11,11,13,0.32)';
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation = 'lighter';
    var diag = Math.hypot(CX,CY);
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      s.pz = s.z;
      s.z -= speed;
      if(s.z <= 0.02){ s.x = rnd(-1,1); s.y = rnd(-1,1); s.z = 1; s.pz = 1; }
      var sx  = CX + (s.x / s.z)  * diag;
      var sy  = CY + (s.y / s.z)  * diag;
      var psx = CX + (s.x / s.pz) * diag;
      var psy = CY + (s.y / s.pz) * diag;
      var r = 1 - s.z;                          // closeness 0..~1
      ctx.strokeStyle = s.col;
      ctx.globalAlpha = Math.min(1, r*1.1) * fadeIn;
      ctx.lineWidth = Math.max(0.6, r*2.4*DPR);
      ctx.beginPath();
      ctx.moveTo(psx, psy);
      ctx.lineTo(sx, sy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);

  // greeting ~1.15s, fade out ~2.3s (handoff to workbench)
  timeline(700, 1600);
})();
</script>
</body>
</html>
